name: CI

on:
  push:
  pull_request:

jobs:
  extension:
    name: Extension, PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: ['nts', 'zts']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none
          # ZTS builds also run the thread tests, which need parallel
          extensions: ${{ matrix.ts == 'zts' && 'parallel, intl' || 'intl' }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Build
        run: phpize && ./configure && make -j"$(nproc)"
      - name: Tests
        # run-tests.php with the PHP's own ini (make test runs with -n), so intl and, on ZTS,
        # parallel are loaded and the locale and thread tests run instead of skipping
        run: |
          php run-tests.php -P -q --no-color --show-diff -d extension=$PWD/modules/scope.so tests/ | tee test.log
          grep -Eq '^Tests failed +: +0 ' test.log
          # A build that fails to load runs zero tests and still reports zero failures.
          grep -Eq '^Tests passed +: +[1-9]' test.log
          php -d extension=modules/scope.so -r 'var_dump(Scope::getCurrent() === Scope::getRootScope());' | grep -q 'bool(true)'
          # the locale tests must have run, and on ZTS the thread tests too
          grep -Eq 'PASS .*\[tests/localetz_locale_isolation.phpt\]' test.log
          if [ "${{ matrix.ts }}" = zts ]; then grep -Eq 'PASS .*\[tests/zts_parallel_isolation.phpt\]' test.log && grep -Eq 'PASS .*\[tests/zts_parallel_boundaries.phpt\]' test.log; fi
