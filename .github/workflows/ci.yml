name: CI

on:
  push:
  pull_request:

jobs:
  extension:
    name: Extension, PHP ${{ matrix.php }} ${{ matrix.ts }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        ts: ['nts', 'zts']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none
          # ZTS builds also run the thread tests, which need parallel
          extensions: ${{ matrix.ts == 'zts' && 'parallel, intl' || 'intl' }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Build
        run: phpize && ./configure && make -j"$(nproc)"
      - name: make test
        run: |
          make test NO_INTERACTION=1 REPORT_EXIT_STATUS=1 TESTS="--show-diff tests" | tee test.log
          # A build that fails to load runs zero tests and still reports zero failures.
          grep -Eq '^Tests passed +: +[1-9]' test.log
          php -d extension=modules/scope.so -r 'var_dump(Scope::getCurrent() === Scope::getRootScope());' | grep -q 'bool(true)'
          # on ZTS the thread tests must have run, not been skipped
          if [ "${{ matrix.ts }}" = zts ]; then grep -Eq '^PASS .*zts_parallel_isolation' test.log && grep -Eq '^PASS .*zts_parallel_boundaries' test.log; fi
