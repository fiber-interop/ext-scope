name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Build
        run: |
          phpize
          ./configure --enable-scope
          # The committed arginfo targets the latest PHP; regenerate it for the PHP
          # under test (-f: gen_stub skips when the stub hash is unchanged).
          php build/gen_stub.php -f scope.stub.php
          make -j"$(nproc)"

      - name: Test
        env:
          NO_INTERACTION: '1'
          REPORT_EXIT_STATUS: '1'
          TEST_PHP_ARGS: '--show-diff'
        run: make test TESTS=tests/
